name: Nodos Plugins

on:
  workflow_call:
    secrets:
      CI_TOKEN:
        required: true
      NODOS_STORE_ACCESS_TOKEN:
        required: true
        description: 'Access token for Nodos Store authentication (publishing)'
      SENTRY_TOKEN:
        required: false
        description: 'If provided, PDBs will be uploaded to Sentry'
    inputs:
      ref_name:
        required: true
        type: string
      publish_mode:
        type: string
        description: 'Publish Mode. Options: If Changed, Force, None'
        default: 'If Changed'
      plugin_names:
        description: 'Publish only these plugins (semicolon-delimited)'
        required: false
        default: ''
        type: string
      nodos_version:
        description: 'Nodos version for pre-1.4 plugins, whose builds need the engine in the workspace (nosman get --version). Empty or 1.4+ builds against the SDK the manifests declare.'
        required: false
        default: ''
        type: string
      clean:
        description: 'Clean build'
        required: false
        default: false
        type: boolean
      build_number:
        description: 'Build number'
        required: false
        default: '0'
        type: string
      sign_binaries:
        description: 'Sign binaries'
        required: false
        default: false
        type: boolean
      pre_config_command:
        description: 'Execute a command before configuration steps'
        required: false
        default: ''
        type: string
      linux:
        description: 'Release for Linux'
        required: false
        default: true
        type: boolean
      windows:
        description: 'Release for Windows'
        required: false
        default: true
        type: boolean
      run_tests:
        description: 'Run tests'
        required: false
        default: false
        type: boolean

jobs:
  prepare-strategy:
    name: Prepare Strategy
    runs-on: self-hosted
    outputs:
      runner-list: ${{ steps.prepare-step.outputs.runner-list }}
    steps:
      - name: Prepare Runner List
        id: prepare-step
        shell: bash
        run: |
          runner_list=$(python3 -c "$(curl -fsSL https://raw.githubusercontent.com/nodos-dev/actions/refs/heads/main/scripts/prep_runner_list.py)" \
            --workflow-input-linux ${{ inputs.linux }} \
            --workflow-input-windows ${{ inputs.windows }} \
            --sign ${{ inputs.sign_binaries }} \
            --ref-name ${{ inputs.ref_name }} \
            --event-name "workflow_call")
          echo Runners: $runner_list
          echo "runner-list=$runner_list" >> $GITHUB_OUTPUT

  build:
    strategy:
      matrix:
        runner: ${{ fromJson(needs.prepare-strategy.outputs.runner-list) }}
      fail-fast: false
    name: "${{ inputs.ref_name }} - ${{ inputs.build_number }} (${{ matrix.runner[0] }}) ${{ (inputs.publish_mode != 'None' && ' (Publishing)') || '' }} ${{ (inputs.publish_mode == 'None' && ' (Build Only)') || '' }}"
    needs: prepare-strategy
    runs-on: ${{ matrix.runner }}

    env:
      GH_USERNAME: "zerodensitybot"
      GIT_EMAIL: "bot@nodos.dev"
      GH_TOKEN: ${{ secrets.CI_TOKEN }}
      NODOS_STORE_ACCESS_TOKEN: ${{ secrets.NODOS_STORE_ACCESS_TOKEN }}
      RUST_BACKTRACE: 1

    steps:
      - name: Setup Environment Variables
        env:
          NODOS_VERSION: ${{ inputs.nodos_version }}
        run: |
          if [ "${{ matrix.runner[0] }}" == "Windows" ]; then
            echo "NOSMAN_EXECUTABLE_NAME=nodos.exe" >> $GITHUB_ENV
          else
            echo "NOSMAN_EXECUTABLE_NAME=nodos" >> $GITHUB_ENV
          fi
          # Only plugins older than 1.4 need the engine in the workspace.
          legacy=false
          if [ -n "$NODOS_VERSION" ]; then
            if [[ ! "$NODOS_VERSION" =~ ^([0-9]+)\.([0-9]+) ]]; then
              echo "::error::nodos_version must start with major.minor, got '$NODOS_VERSION'"
              exit 1
            fi
            major=${BASH_REMATCH[1]}
            minor=${BASH_REMATCH[2]}
            if [ "$major" -lt 1 ] || { [ "$major" -eq 1 ] && [ "$minor" -lt 4 ]; }; then
              legacy=true
            fi
          fi
          echo "LEGACY_WORKSPACE=$legacy" >> $GITHUB_ENV
        shell: bash

      - name: Update Git Credentials
        continue-on-error: true
        shell: bash
        run: |
          git credential-manager github login --username ${{ env.GH_USERNAME }} --token ${{ secrets.CI_TOKEN }} --force

      - name: Clean Build
        shell: pwsh
        if: ${{ inputs.clean }}
        run: |
          if (Test-Path -Path ./plugins-${{ inputs.ref_name }}) { Remove-Item -Path ./plugins-${{ inputs.ref_name }} -Recurse -Force }

      - name: Setup Work Folder
        shell: pwsh
        run: |
          if (-not (Test-Path -Path ./plugins-${{ inputs.ref_name }})) { New-Item -Path ./plugins-${{ inputs.ref_name }} -ItemType Directory -Force }

      - name: Ensure Nosman
        run: |
          $ErrorActionPreference = 'Stop'
          # nosman is published to crates.io; install from there so every
          # platform (incl. macOS) gets a native binary without per-OS assets.
          cargo install nosman
          if ($LASTEXITCODE -ne 0) { throw "cargo install nosman failed with exit code $LASTEXITCODE" }

          $binName = if ($IsWindows) { "nosman.exe" } else { "nosman" }
          $cargoBin =
            if ($env:CARGO_INSTALL_ROOT) { Join-Path $env:CARGO_INSTALL_ROOT "bin" }
            elseif ($env:CARGO_HOME) { Join-Path $env:CARGO_HOME "bin" }
            else { Join-Path $HOME ".cargo/bin" }
          $nosmanPath = Join-Path $cargoBin $binName
          if (-not (Test-Path -Path $nosmanPath)) { throw "nosman not found at $nosmanPath after cargo install" }

          "SYSTEM_NOSMAN_PATH=$nosmanPath" >> $env:GITHUB_ENV
          Write-Host "Using nosman at $nosmanPath"
          & $nosmanPath --version
        shell: pwsh
        working-directory: plugins-${{ inputs.ref_name }}

      - name: Setup Nodos Workspace
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -Path ./workspace)) { New-Item -Path ./workspace -ItemType Directory -Force | Out-Null }
          $nosmanDestination = if ($IsWindows) { "nodos.exe" } else { "nodos" }
          $nosmanDestinationPath = Join-Path ./workspace $nosmanDestination
          Copy-Item -Path "${{ env.SYSTEM_NOSMAN_PATH }}" -Destination $nosmanDestinationPath -Force
          if (-not $IsWindows) { & chmod +x $nosmanDestinationPath }
          Push-Location ./workspace
          & ${{ env.SYSTEM_NOSMAN_PATH }} init --reinit
          & ${{ env.SYSTEM_NOSMAN_PATH }} dev init --toolchain cmake
          if (-not (Test-Path -Path ./Module)) { New-Item -Path ./Module -ItemType Directory -Force | Out-Null }
          Pop-Location
        shell: pwsh
        working-directory: plugins-${{ inputs.ref_name }}

      - name: Setup Nodos Workspace (Legacy)
        if: ${{ env.LEGACY_WORKSPACE == 'true' }}
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location ./workspace
          ./${{ env.NOSMAN_EXECUTABLE_NAME }} get --version "${{ inputs.nodos_version }}" -y --name nodos
          Copy-Item -Path "${{ env.SYSTEM_NOSMAN_PATH }}" -Destination "./${{ env.NOSMAN_EXECUTABLE_NAME }}" -Force
          if (-not $IsWindows) { & chmod +x "./${{ env.NOSMAN_EXECUTABLE_NAME }}" }
          Write-Host "Workspace nosman version:"
          ./${{ env.NOSMAN_EXECUTABLE_NAME }} --version
          Pop-Location
        shell: pwsh
        working-directory: plugins-${{ inputs.ref_name }}

      - name: Checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -Path ./plugins-repo)) {
            git clone --branch ${{ inputs.ref_name }} --depth 1 https://github.com/${{ github.repository }}.git --recurse-submodule --shallow-submodules ./plugins-repo
          }
          cd ./plugins-repo
          git fetch origin
          git fetch --tags --force
          git clean -ffd
          git checkout ${{ github.sha }}
          git reset --hard
          git submodule update --force --recursive --init
          git status
        working-directory: plugins-${{ inputs.ref_name }}/workspace/Module

      - name: Setup Git
        run: |
          git config user.email "${{ env.GIT_EMAIL }}"
          git config user.name "${{ env.GH_USERNAME }}"
        working-directory: plugins-${{ inputs.ref_name }}/workspace/Module/plugins-repo
  
      - name: Update Nosman Cache
        shell: pwsh
        run: |
          ./${{ env.NOSMAN_EXECUTABLE_NAME }} rescan --fetch-index
        working-directory: plugins-${{ inputs.ref_name }}/workspace

      - name: Resolve Plugin Directories
        if: ${{ inputs.plugin_names != '' && env.LEGACY_WORKSPACE != 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspaceRoot = (Resolve-Path .).Path
          $pkgNames = "${{ inputs.plugin_names }}" -split ';' | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne '' }
          if ($pkgNames.Count -eq 0) { throw "plugin_names is set but no valid plugin name was provided." }
          $moduleDirs = @()
          foreach ($pkgName in $pkgNames) {
            $listOutput = & ./${{ env.NOSMAN_EXECUTABLE_NAME }} list --local --package-name "$pkgName"
            $cleanLines = $listOutput | ForEach-Object { $_ -replace "\x1B\[[0-9;]*[A-Za-z]", "" }
            $entries = @()
            foreach ($line in $cleanLines) {
              if ($line -match '^\s*(\d+\.\d+\.\d+(?:[-+.\w]*)?)\s+\((.+)\)\s*$') {
                $entries += [pscustomobject]@{ Version = $Matches[1]; Path = $Matches[2] }
              }
            }
            if ($entries.Count -eq 0) { throw "No local package found for $pkgName" }
            $version = $entries[-1].Version
            $infoJson = & ./${{ env.NOSMAN_EXECUTABLE_NAME }} info "$pkgName" "$version"
            $info = $infoJson | Out-String | ConvertFrom-Json
            if (-not $info.manifest_path) { throw "manifest_path not found for $pkgName $version" }
            $moduleDir = Split-Path -Parent $info.manifest_path
            $relativeModuleDir = [System.IO.Path]::GetRelativePath($workspaceRoot, $moduleDir)
            $relativeModuleDir = $relativeModuleDir -replace '\\', '/'
            $moduleDirs += $relativeModuleDir
          }
          $moduleDirsValue = ($moduleDirs | Sort-Object -Unique) -join ';'
          "MODULE_DIRS=$moduleDirsValue" >> $env:GITHUB_ENV
        working-directory: plugins-${{ inputs.ref_name }}/workspace

      - name: Pre-Configure
        shell: pwsh
        run: |
          ${{inputs.pre_config_command}}
        working-directory: plugins-${{ inputs.ref_name }}/workspace/Module/plugins-repo

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ("${{ inputs.plugin_names }}" -ne "" -and $env:LEGACY_WORKSPACE -ne 'true') {
            if ([string]::IsNullOrEmpty($env:MODULE_DIRS)) { throw "MODULE_DIRS is not set for plugin build." }
            $pluginArgs = @("--plugin-dirs", $env:MODULE_DIRS)
          } else {
            $pluginArgs = @("--plugin-dirs", "Module")
          }
          ./${{ env.NOSMAN_EXECUTABLE_NAME }} dev gen --language-tool cpp/cmake --project-folder ../Project @pluginArgs -- -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "Configure failed with exit code $LASTEXITCODE" }
        working-directory: plugins-${{ inputs.ref_name }}/workspace

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./${{ env.NOSMAN_EXECUTABLE_NAME }} dev build --language-tool cpp/cmake --project-folder ../Project --config Release
          if ($LASTEXITCODE -ne 0) { throw "Build failed with exit code $LASTEXITCODE" }
        working-directory: plugins-${{ inputs.ref_name }}/workspace

      - name: Regression Tests
        shell: pwsh
        if: ${{ inputs.run_tests }}
        run: |
          $ErrorActionPreference = 'Stop'
          
          # Windows-specific firewall setup
          if ("${{ matrix.runner[0] }}" -eq "Windows") {
            $ExePath = (Get-ChildItem -Path ./Engine -Filter "nosLauncher.exe" -Recurse | Select-Object -First 1).FullName
            if ($ExePath) {
              # Remove existing rules if they exist
              Remove-NetFirewallRule -DisplayName "CI Allow Nodos Inbound" -ErrorAction SilentlyContinue
              Remove-NetFirewallRule -DisplayName "CI Allow Nodos Outbound" -ErrorAction SilentlyContinue
              
              # Create new firewall rules
              New-NetFirewallRule -DisplayName "CI Allow Nodos Inbound" -Direction Inbound -Program $ExePath -Action Allow -Profile Any -Enabled True
              New-NetFirewallRule -DisplayName "CI Allow Nodos Outbound" -Direction Outbound -Program $ExePath -Action Allow -Profile Any -Enabled True
              Write-Host "Firewall rules created for: $ExePath"
            } else {
              Write-Host "Warning: nosLauncher.exe not found in Engine directory"
            }
          }
          
          # Run tests
          Write-Host "Running regression tests..."
          ./nodos test
          
          # Cleanup firewall rules on Windows
          if ("${{ matrix.runner[0] }}" -eq "Windows") {
            Remove-NetFirewallRule -DisplayName "CI Allow Nodos Inbound" -ErrorAction SilentlyContinue
            Remove-NetFirewallRule -DisplayName "CI Allow Nodos Outbound" -ErrorAction SilentlyContinue
            Write-Host "Firewall rules cleaned up"
          }
        working-directory: plugins-${{ inputs.ref_name }}/workspace

      - name: Sign Binaries
        if: ${{ inputs.publish_mode != 'None' && inputs.sign_binaries }}
        run: |
          cd $MEDIAZ_SCRIPTS_DIR
          python sign_module.py "${{ github.workspace }}/plugins-${{ inputs.ref_name }}/workspace/Module/plugins-repo"
        shell: bash

      - name: Upload PDBs
        if: ${{ inputs.publish_mode != 'None' && matrix.runner[0] == 'Windows'}}
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty("${{ secrets.SENTRY_TOKEN }}")) {
            echo "SENTRY_TOKEN is not provided. Skipping PDB upload."
          } else {
            sentry-cli login --auth-token="${{ secrets.SENTRY_TOKEN }}"
            Get-ChildItem -Path . -Recurse -Filter "*.pdb" | ForEach-Object {
              sentry-cli debug-files upload -o mediaz-teknoloji -p nodos $_.FullName
            }
          }
        working-directory: plugins-${{ inputs.ref_name }}/

      - name: Publish (If Changed)
        if: ${{ inputs.publish_mode == 'If Changed' }}
        shell: bash
        run: |
          packages_args=()
          if [ -n "${{ inputs.plugin_names }}" ]; then
            IFS=';' read -ra pkg_array <<< "${{ inputs.plugin_names }}"
            for pkg in "${pkg_array[@]}"; do
              pkg_trimmed="$(printf '%s' "$pkg" | xargs)"
              if [ -n "$pkg_trimmed" ]; then
                packages_args+=(--packages "$pkg_trimmed")
              fi
            done
          fi

          ../../${{ env.NOSMAN_EXECUTABLE_NAME }} \
            --workspace ../../ \
            publish-batch \
            --directory . \
            "${packages_args[@]}" \
            --version-suffix ".b${{ inputs.build_number }}" \
            --verbose \
            --tag "${{ inputs.ref_name }}" \
            --visibility private
        working-directory: plugins-${{ inputs.ref_name }}/workspace/Module/plugins-repo

      - name: Publish (Force)
        if: ${{ inputs.publish_mode == 'Force' }}
        shell: bash
        run: |
          packages_args=()
          if [ -n "${{ inputs.plugin_names }}" ]; then
            IFS=';' read -ra pkg_array <<< "${{ inputs.plugin_names }}"
            for pkg in "${pkg_array[@]}"; do
              pkg_trimmed="$(printf '%s' "$pkg" | xargs)"
              if [ -n "$pkg_trimmed" ]; then
                packages_args+=(--packages "$pkg_trimmed")
              fi
            done
          fi

          ../../${{ env.NOSMAN_EXECUTABLE_NAME }} \
            --workspace ../../ \
            publish-batch \
            --directory . \
            "${packages_args[@]}" \
            --version-suffix ".b${{ inputs.build_number }}" \
            --verbose \
            --tag "${{ inputs.ref_name }}" \
            --visibility private \
            --publish-all
        working-directory: plugins-${{ inputs.ref_name }}/workspace/Module/plugins-repo
      
